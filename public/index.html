<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL Shortener</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:4rem auto;padding:0 1rem;color:#1a1a1a}
  input,button{font:inherit;padding:.6rem;margin:.3rem 0;width:100%;box-sizing:border-box}
  button{cursor:pointer;background:#1a1a1a;color:#fff;border:0;border-radius:6px}
  #out{margin-top:1rem;word-break:break-all}
</style>
</head>
<body>
<h1>URL Shortener</h1>
<input id="url" placeholder="https://example.com/very/long/link">
<input id="alias" placeholder="Custom alias (optional)">
<button onclick="go()">Shorten</button>
<div id="out"></div>
<script>
async function go(){
  const body={url:document.getElementById('url').value};
  const a=document.getElementById('alias').value.trim();
  if(a) body.alias=a;
  const r=await fetch('/api/shorten',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json(), out=document.getElementById('out');
  out.textContent='';
  if(!r.ok){out.textContent='Error: '+d.error;return}
  const link=document.createElement('a');link.href=d.shortUrl;link.textContent=d.shortUrl;
  out.append('Short link: ',link);
}
</script>
</body>
</html>
